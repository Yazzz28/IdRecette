<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IDrecette V.2</title>
  <meta name="description" content="Les recettes de la bande : plats, apéros, desserts, glaces… Portions ajustables, menu et liste de courses inclus.">
  <meta name="theme-color" content="#F6F5F1">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="header">
    <div class="container header__top">
      <a class="brand" href="#/" aria-label="IDrecette V.2, retour aux recettes">
        <img class="brand__icon" src="assets/logo.svg" alt="" width="48" height="48">
        <span class="brand__name">IDrecette</span>
        <span class="version" aria-hidden="true">
          <span class="version__old">V.1</span>
          <span class="version__pill">V.2</span>
        </span>
      </a>

      <nav class="topnav" aria-label="Navigation principale">
        <a class="topnav__link" href="#/" data-nav="recettes">Recettes</a>
        <a class="topnav__link" href="#/menu" data-nav="menu">Menu <span class="nav__badge" hidden></span></a>
        <a class="topnav__link" href="#/courses" data-nav="courses">Courses <span class="nav__badge" hidden></span></a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="view-recettes" class="view" aria-label="Recettes"></section>
    <section id="view-menu" class="view" aria-label="Mon menu" hidden></section>
    <section id="view-courses" class="view" aria-label="Liste de courses" hidden></section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p><strong>IDrecette V.2</strong> · La deuxième, c'est la bonne.</p>
      <p>Les recettes viennent de <code>data.json</code>. Tes favoris, ton menu et ta liste de courses restent dans ce navigateur.</p>
    </div>
  </footer>

  <nav class="tabbar" aria-label="Navigation">
    <a class="tabbar__link" href="#/" data-nav="recettes"><span class="tabbar__icon" data-icon="book"></span>Recettes</a>
    <a class="tabbar__link" href="#/menu" data-nav="menu"><span class="tabbar__icon" data-icon="menu"></span>Menu<span class="nav__badge" hidden></span></a>
    <a class="tabbar__link" href="#/courses" data-nav="courses"><span class="tabbar__icon" data-icon="cart"></span>Courses<span class="nav__badge" hidden></span></a>  </nav>

  <dialog id="recipe-modal" class="modal" aria-labelledby="modal-title">
    <div class="modal__scroll"></div>
  </dialog>

  <noscript><p class="container">Active JavaScript pour voir les recettes. Promis, on ne fait rien de louche.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
